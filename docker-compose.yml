# Cú — PC tại nhà (SPEC §14b).
# Dev  : docker compose up -d postgres redis math-verifier   (docker-compose.override.yml tự gộp: mở cổng localhost)
# Prod : pnpm prod:up   (= docker compose -f docker-compose.yml --profile prod up -d — KHÔNG gộp override,
#        nên postgres/redis/math-verifier không publish cổng nào)
name: cu

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://cu_app:${CU_APP_PASSWORD}@postgres:5432/cu
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  MATH_VERIFIER_URL: http://math-verifier:8001
  STORAGE_DIR: /data/storage
  LIFE_CONTEXTS_DIR: /app/data/life-contexts
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET chưa đặt}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET chưa đặt}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY chưa đặt}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  CLAUDE_WORKSPACE_ID: ${CLAUDE_WORKSPACE_ID:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  SMTP_FROM: ${SMTP_FROM:-}
  APP_BASE_URL: ${APP_BASE_URL:-}

x-app-image: &app-image
  image: cu-app:latest
  build:
    context: .
    args:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt}
      CU_OWNER_PASSWORD: ${CU_OWNER_PASSWORD:?CU_OWNER_PASSWORD chưa đặt}
      CU_APP_PASSWORD: ${CU_APP_PASSWORD:?CU_APP_PASSWORD chưa đặt}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD chưa đặt}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]

  # Mạng `verifier` internal: không ra internet, chỉ app/admin/worker gọi được (không chung mạng với DB).
  math-verifier:
    build: ./services/math-verifier
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [verifier]

  # ───────────── Prod ─────────────
  # Migration chạy một lần bằng cu_owner trước app/admin/worker.
  migrate:
    <<: *app-image
    profiles: [prod]
    restart: "no"
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_OWNER_URL: postgresql://cu_owner:${CU_OWNER_PASSWORD}@postgres:5432/cu
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  # Cổng công khai: chỉ vào qua Cloudflare Tunnel; KHÔNG publish cổng ra máy host. /admin → 404.
  app:
    <<: *app-image
    profiles: [prod]
    environment:
      <<: *app-env
      ADMIN_ENABLED: "false"
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, verifier, edge]

  # Quản trị: chỉ 127.0.0.1:3001, Tailscale Serve trỏ tới (KHÔNG tailscale funnel, không port forwarding).
  admin:
    <<: *app-image
    profiles: [prod]
    environment:
      <<: *app-env
      ADMIN_ENABLED: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - storage:/data/storage
      # Màn hình Duyệt ghi trạng thái duyệt ngược vào YAML (data/life-contexts) để seed DB khác mang theo.
      - ./data/life-contexts:/app/data/life-contexts
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, verifier, admin-host]

  worker:
    <<: *app-image
    profiles: [prod]
    command: ["node", "--conditions=react-server", "dist/worker/index.mjs"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      ADMIN_ENABLED: "false"
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, verifier, egress]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    profiles: [prod]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN chưa đặt}
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]

volumes:
  pgdata:
  storage:

networks:
  data:
    internal: true
  verifier:
    internal: true
  # Tunnel ↔ app, và ra internet cho cloudflared + LLM của app.
  edge: {}
  # Admin publish cổng localhost cần một mạng không-internal (và gọi LLM khi cần).
  admin-host: {}
  # Worker gọi Claude API / OpenRouter / SMTP.
  egress: {}
