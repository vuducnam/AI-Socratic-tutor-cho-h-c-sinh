# Dev: docker compose up -d postgres redis math-verifier
# Prod (phase 19): docker compose --profile prod up -d
name: cu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt}
      CU_OWNER_PASSWORD: ${CU_OWNER_PASSWORD:?CU_OWNER_PASSWORD chưa đặt}
      CU_APP_PASSWORD: ${CU_APP_PASSWORD:?CU_APP_PASSWORD chưa đặt}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # Dev: chỉ localhost. Prod (phase 19) không publish cổng.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD chưa đặt}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]

  math-verifier:
    build: ./services/math-verifier
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Dev: publish localhost để app chạy ngoài Docker gọi được; Docker chỉ publish cổng khi container có
    # mạng không-internal nên dev gắn thêm `dev-host`. Prod (phase 19) bỏ cổng và `dev-host`, chỉ còn
    # mạng internal `verifier` (không ra internet, chỉ app/worker gọi được).
    ports:
      - "127.0.0.1:8001:8001"
    networks: [verifier, dev-host]

volumes:
  pgdata:

networks:
  data: {}
  verifier:
    internal: true
  dev-host: {}
