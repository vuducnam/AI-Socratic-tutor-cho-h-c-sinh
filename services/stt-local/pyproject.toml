[project]
name = "stt-local"
version = "0.1.0"
description = "Nhận dạng giọng nói tại PC cho Cú (SPEC §10, quy tắc cứng 10): audio không rời máy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.18",
  "numpy>=2",
]

[project.optional-dependencies]
# torch có sẵn trong image pytorch/pytorch (Dockerfile); không cài lại ở đây.
ml = ["transformers>=4.56,<6", "huggingface_hub>=0.34"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
