[project]
name = "math-verifier"
version = "0.1.0"
description = "Kiểm đáp án toán bằng sympy cho Pre-solver của Cú (SPEC §15.7)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sympy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
