    misconceptions:
      - id: MISSING_ZERO_PLACEHOLDER
        description: "Viết 5/100 thành 0,5: quên chữ số 0 giữ chỗ hàng phần mười"
        probe: "Trong 0,5 thì chữ số 5 đứng ở hàng nào, còn đề bài nói mấy phần trăm?"
