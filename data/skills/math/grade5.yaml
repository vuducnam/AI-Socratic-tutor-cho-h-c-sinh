      - id: FIVE_ROUNDS_DOWN
        description: "Làm tròn 3,25 đến hàng phần mười thành 3,2: nghĩ chữ số 5 thì làm tròn xuống"
        probe: "Chữ số đang xét bằng 5 thì theo cách sách dạy con làm tròn lên hay làm tròn xuống?"
