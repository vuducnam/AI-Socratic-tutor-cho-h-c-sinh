  - skill_id: MATH.DECIMAL.COMPARE
    name: So sánh các số thập phân
    subject: math
    grade_introduced: 5
    prerequisites:
      - MATH.DECIMAL.CONCEPT
    # probe là câu Cú hỏi để dò lỗi: một câu hỏi, không nói đáp án, chỉ dùng từ con đã học.
    misconceptions:
      - id: LONGER_IS_BIGGER
        description: "Nghĩ 0,45 > 0,5 vì 45 > 5: so phần thập phân như so số tự nhiên"
        probe: "Nếu chia cái bánh thành các phần bằng nhau, 5 phần mười và 45 phần trăm cái bánh thì phần nào nhiều hơn?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
      - id: SHORTER_IS_BIGGER
        description: "Nghĩ 0,3 > 0,35 vì phần thập phân ít chữ số hơn"
        probe: "Nếu viết thêm chữ số 0 vào tận cùng bên phải 0,3 thì được số nào, rồi so với 0,35 ra sao?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
      - id: TRAILING_ZERO_CHANGES_VALUE
        description: "Nghĩ 7,30 > 7,3 vì có thêm chữ số 0"
        probe: "Nếu đổi 7,3 m và 7,30 m ra xăng-ti-mét thì mỗi số đo được bao nhiêu?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
      - id: IGNORE_WHOLE_PART
        description: "So phần thập phân trước, bỏ qua phần nguyên (cho rằng 1,95 > 2,9)"
        probe: "Trong hai số này, phần nguyên của mỗi số là bao nhiêu?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
    source:
      series: Kết nối tri thức với cuộc sống
      publisher: NXB Giáo dục Việt Nam
      book: Toán 5, Tập 1
      lesson: Bài 11. So sánh các số thập phân
      pages: 38-41
      official_url: https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373
      imported_at: 2026-10-20
  - skill_id: MATH.DECIMAL.MEASURE_NOTATION
    name: Viết số đo đại lượng dưới dạng số thập phân
    subject: math
    grade_introduced: 5
    prerequisites:
      - MATH.DECIMAL.CONCEPT
    # probe là câu Cú hỏi để dò lỗi: một câu hỏi, không nói đáp án, chỉ dùng từ con đã học.
    misconceptions:
      - id: MISSING_ZERO_IN_SMALL_UNIT
        description: "Viết 2 m 5 cm = 2,5 m: quên 5 cm là 5 phần trăm mét"
        probe: "5 cm là mấy phần trăm của mét, nên chữ số 5 phải đứng ở hàng nào sau dấu phẩy?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
      - id: WRONG_UNIT_RATIO
        description: "Viết 2 kg 50 g = 2,50 kg: dùng quan hệ 100 thay vì 1 000 giữa kg và g"
        probe: "1 kg bằng bao nhiêu gam, vậy 50 g là mấy phần nghìn của ki-lô-gam?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
      - id: AREA_RATIO_TEN
        description: "Viết 56 dm² = 5,6 m²: nghĩ hai đơn vị diện tích liền nhau hơn kém 10 lần"
        probe: "Hai đơn vị đo diện tích liền nhau hơn kém nhau bao nhiêu lần?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
    source:
      series: Kết nối tri thức với cuộc sống
      publisher: NXB Giáo dục Việt Nam
      book: Toán 5, Tập 1
