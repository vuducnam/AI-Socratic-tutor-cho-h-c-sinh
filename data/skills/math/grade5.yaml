      - id: JOIN_NUMERATOR_DENOMINATOR
        description: "Viết 7/10 thành 7,10 hoặc 0,710: ghép tử số và mẫu số thành số thập phân"
        probe: "7/10 nghĩa là lấy mấy phần trong các phần bằng nhau của một đơn vị?"
        approved: { by: "vuduc.nam64@gmail.com", at: "2026-10-20" }
