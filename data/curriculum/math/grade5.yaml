    lesson_no: 6
    title: "Cộng, trừ hai phân số khác mẫu số"
    skill_ids: []
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Hai mẫu số không chia hết cho nhau: lấy mẫu số chung là tích hai mẫu số, nhân cả tử và mẫu của mỗi phân số với mẫu số của phân số kia"   # tr.20
      - "Sau khi quy đồng, cộng các tử số và giữ nguyên mẫu số chung"   # tr.20
      - "Phép trừ làm tương tự: quy đồng mẫu số rồi trừ các tử số, giữ mẫu số chung"   # tr.21
      - "Cộng (trừ) hai phân số khác mẫu số: quy đồng mẫu số trước, rồi cộng (trừ) hai phân số đã quy đồng"   # tr.21
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "20-22", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B7
    seq: 7
    book: T1
    topic: "ÔN TẬP VÀ BỔ SUNG"
    lesson_no: 7
    title: "Hỗn số"
    skill_ids: [MATH.FRACTION.MIXED_NUMBER]
    introduces_terms:   # đã đọc SGK 2026-10-20
      - term: "Hỗn số"   # tr.23
        patterns: ["hỗn số"]
      - term: "Phần nguyên"   # tr.23
        patterns: ["re:(?<![\\p{L}\\p{M}\\p{N}])phần\\s+nguyên(?!\\s+(vẹn|liệu))(?![\\p{L}\\p{M}\\p{N}])"]
      - term: "Phần phân số"   # tr.23
        patterns: ["phần phân số"]
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Viết gọn một số tự nhiên và một phân số bé hơn 1 thành hỗn số"   # tr.23
      - "Hỗn số có phần nguyên là số tự nhiên và phần phân số bé hơn 1"   # tr.23
      - "Đọc hỗn số: đọc phần nguyên, rồi chữ 'và', rồi phần phân số"   # tr.23
      - "Viết hỗn số từ hình: số hình tô kín là phần nguyên, phần tô của hình chưa kín là phần phân số"   # tr.24
      - "Tách hỗn số thành tổng phần nguyên cộng phần phân số"   # tr.24
      - "Đặt hỗn số lên tia số giữa hai số tự nhiên liên tiếp, đoạn giữa chia 10 phần"   # tr.24
      - "Chuyển hỗn số thành phân số thập phân: viết thành tổng phần nguyên với phần phân số rồi gộp thành một phân số"   # tr.25
      - "Chuyển phân số thập phân lớn hơn 1 thành hỗn số: tách tử số thành tổng một số chia hết cho mẫu với phần còn lại, tách thành tổng hai phân số, đổi phân số đầu thành số tự nhiên rồi viết gọn"   # tr.25
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "23-25", imported_at: 2026-10-20 }
