  # --- Chủ đề 2: SỐ THẬP PHÂN
  - lesson_id: MATH5.T1.B10
    seq: 10
    book: T1
    topic: "SỐ THẬP PHÂN"
    lesson_no: 10
    title: "Khái niệm số thập phân"
    skill_ids: [MATH.DECIMAL.CONCEPT]
    introduces_terms:   # đã đọc SGK 2026-10-20
      - term: "Số thập phân"   # tr.32
        # Không khớp bên trong "phân số thập phân" (thuật ngữ Bài 4).
        patterns: ['re:(?<!phân\s)(?<![\p{L}\p{M}\p{N}])số\s+thập\s+phân(?![\p{L}\p{M}\p{N}])']
      - term: "Phần thập phân"   # tr.33
        patterns: ["phần thập phân"]
      - term: "Hàng phần mười"   # tr.35
        patterns: ["hàng phần mười"]
      - term: "Hàng phần trăm"   # tr.35
        patterns: ["hàng phần trăm"]
      - term: "Hàng phần nghìn"   # tr.35
        patterns: ["hàng phần nghìn"]
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Đổi số đo từ đơn vị nhỏ sang đơn vị lớn: viết thành phân số thập phân (hoặc hỗn số) của đơn vị lớn, rồi viết thành số thập phân"   # tr.32
      - "Số thập phân có phần nguyên và phần thập phân, ngăn nhau bởi dấu phẩy: chữ số bên trái dấu phẩy thuộc phần nguyên, bên phải thuộc phần thập phân"   # tr.33
      - "Trên tia số, đoạn từ 0 đến 1 chia 10 phần bằng nhau, các vạch 1/10, 2/10, ..., 9/10 ứng với 0,1; 0,2; ...; 0,9"   # tr.33
      - "Đọc số thập phân: đọc phần nguyên, đọc 'phẩy', rồi đọc phần thập phân như đọc số tự nhiên; chữ số 0 đứng đầu phần thập phân đọc là 'không'"   # tr.33
      - "Đổi đơn vị đo sang đơn vị lớn gấp 1 000 lần qua phân số thập phân có mẫu 1 000"   # tr.34
      - "Đổi số thập phân về đơn vị nhỏ: viết thành hỗn số, tách thành hai đơn vị, rồi gộp về đơn vị nhỏ"   # tr.34
      - "Viết số thập phân theo các hàng: các chữ số phần thập phân lần lượt chỉ số phần mười, phần trăm, phần nghìn"   # tr.35
      - "Viết số thập phân: viết phần nguyên, viết dấu phẩy, rồi viết phần thập phân"   # tr.35
      - "Chuyển phân số thập phân thành số thập phân: viết thành hỗn số, rồi viết phần nguyên trước dấu phẩy và tử số của phân số sau dấu phẩy"   # tr.36
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "32-37", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B11
    seq: 11
    book: T1
    topic: "SỐ THẬP PHÂN"
    lesson_no: 11
    title: "So sánh các số thập phân"
    skill_ids: [MATH.DECIMAL.COMPARE]
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Khám phá: đổi hai số đo về cùng một đơn vị nhỏ hơn để được số tự nhiên rồi so sánh"   # tr.38
      - "So sánh hai số thập phân: so sánh phần nguyên trước; nếu bằng nhau thì so sánh lần lượt chữ số hàng phần mười, phần trăm, phần nghìn...; hàng đầu tiên khác nhau, số có chữ số lớn hơn thì lớn hơn; phần nguyên và phần thập phân đều bằng nhau thì hai số bằng nhau"   # tr.39
      - "Viết thêm hoặc bỏ chữ số 0 ở tận cùng bên phải phần thập phân thì được số thập phân bằng nó"   # tr.40
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "38-41", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B12
    seq: 12
    book: T1
    topic: "SỐ THẬP PHÂN"
    lesson_no: 12
    title: "Viết số đo đại lượng dưới dạng số thập phân"
    skill_ids: [MATH.DECIMAL.MEASURE_NOTATION]
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Số đo có hai đơn vị độ dài hoặc khối lượng: viết phần đơn vị nhỏ thành phân số thập phân của đơn vị lớn, ghép thành hỗn số, rồi viết số thập phân"   # tr.42
      - "Sau khi đổi, bỏ chữ số 0 ở tận cùng phần thập phân để viết gọn"   # tr.42
      - "Số đo chỉ có đơn vị nhỏ: viết thành phân số thập phân của đơn vị lớn, rồi viết số thập phân"   # tr.43
      - "Số đo diện tích: viết phần đơn vị nhỏ thành phân số thập phân mẫu 100 của đơn vị lớn liền trên, rồi viết số thập phân"   # tr.44
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "42-46", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B13
    seq: 13
    book: T1
    topic: "SỐ THẬP PHÂN"
    lesson_no: 13
    title: "Làm tròn số thập phân"
    skill_ids: [MATH.DECIMAL.ROUND]
    introduces_terms:   # đã đọc SGK 2026-10-20
      - term: "Làm tròn xuống"   # tr.47
        patterns: ["làm tròn xuống"]
      - term: "Làm tròn lên"   # tr.47
        patterns: ["làm tròn lên"]
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Làm tròn số thập phân đến số tự nhiên gần nhất: xét chữ số hàng phần mười; bé hơn 5 thì làm tròn xuống (giữ phần nguyên), bằng hoặc lớn hơn 5 thì làm tròn lên (phần nguyên thêm 1)"   # tr.47
      - "Làm tròn đến hàng phần mười: xét chữ số hàng phần trăm; bé hơn 5 thì làm tròn xuống, còn lại làm tròn lên"   # tr.49
      - "Làm tròn đến hàng phần trăm: xét chữ số hàng phần nghìn; bé hơn 5 thì làm tròn xuống, còn lại làm tròn lên"   # tr.49
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "47-50", imported_at: 2026-10-20 }
