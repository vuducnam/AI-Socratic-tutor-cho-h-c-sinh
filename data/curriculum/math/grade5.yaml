  # --- Chủ đề 4: CÁC PHÉP TÍNH VỚI SỐ THẬP PHÂN
  - lesson_id: MATH5.T1.B19
    seq: 19
    book: T1
    topic: "CÁC PHÉP TÍNH VỚI SỐ THẬP PHÂN"
    lesson_no: 19
    title: "Phép cộng số thập phân"
    skill_ids: [MATH.DECIMAL.ADD]
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Khám phá: đổi hai số đo thập phân ra đơn vị nhỏ hơn thành số tự nhiên, cộng rồi đổi kết quả về đơn vị ban đầu"   # tr.65
      - "Đặt tính cộng hai số thập phân: chữ số cùng hàng thẳng cột, dấu phẩy thẳng cột; cộng như cộng số tự nhiên; dấu phẩy ở tổng thẳng cột với dấu phẩy của các số hạng"   # tr.65
      - "Hai số hạng có số chữ số phần thập phân khác nhau: vẫn xếp thẳng theo dấu phẩy và theo hàng, cột thiếu để trống rồi cộng như số tự nhiên"   # tr.66
      - "Cộng số thập phân với số tự nhiên bằng đặt tính, chữ số cùng hàng thẳng cột (bài tập)"   # tr.67
      - "Đổi chỗ hai số hạng thì tổng không đổi; nhóm số hạng theo cách khác thì tổng không đổi, dùng để tính thuận tiện bằng cách ghép các số có tổng tròn (bài tập, sách không gọi tên tính chất)"   # tr.67
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "65-67", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B20
    seq: 20
    book: T1
    topic: "CÁC PHÉP TÍNH VỚI SỐ THẬP PHÂN"
    lesson_no: 20
    title: "Phép trừ số thập phân"
    skill_ids: [MATH.DECIMAL.SUBTRACT]
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Khám phá: đổi hai số đo ra đơn vị nhỏ hơn thành số tự nhiên, trừ rồi đổi hiệu về đơn vị ban đầu"   # tr.68
      - "Đặt tính trừ hai số thập phân: số trừ dưới số bị trừ, chữ số cùng hàng thẳng cột, dấu phẩy thẳng cột; trừ như trừ số tự nhiên; dấu phẩy ở hiệu thẳng cột với dấu phẩy của số bị trừ và số trừ"   # tr.68
      - "Số trừ có ít chữ số phần thập phân hơn: xếp theo dấu phẩy và theo hàng rồi trừ như số tự nhiên"   # tr.69
      - "Số bị trừ có ít chữ số phần thập phân hơn số trừ hoặc là số tự nhiên: đặt tính chữ số cùng hàng thẳng cột (bài tập, sách không có ví dụ mẫu)"   # tr.70
      - "Tìm số hạng chưa biết bằng phép trừ, tìm số bị trừ chưa biết bằng phép cộng (bài tập)"   # tr.70
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "68-70", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B21
    seq: 21
    book: T1
    topic: "CÁC PHÉP TÍNH VỚI SỐ THẬP PHÂN"
    lesson_no: 21
    title: "Phép nhân số thập phân"
    skill_ids: [MATH.DECIMAL.MULTIPLY]
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Khám phá nhân số thập phân với số tự nhiên: đổi số đo ra đơn vị nhỏ hơn thành số tự nhiên, nhân rồi đổi tích về đơn vị ban đầu"   # tr.71
      - "Nhân số thập phân với số tự nhiên: nhân như hai số tự nhiên; đếm số chữ số phần thập phân của số thập phân rồi dùng dấu phẩy tách ở tích bấy nhiêu chữ số kể từ phải sang trái"   # tr.72
      - "Khám phá nhân hai số thập phân: đổi cả hai số đo ra đơn vị nhỏ hơn, nhân hai số tự nhiên rồi đổi tích về đơn vị ban đầu"   # tr.73
      - "Nhân hai số thập phân: nhân như hai số tự nhiên; đếm tổng số chữ số phần thập phân của cả hai thừa số rồi dùng dấu phẩy tách ở tích bấy nhiêu chữ số kể từ phải sang trái"   # tr.74
      - "Suy ra tích các số thập phân từ một tích số tự nhiên đã biết bằng cách đếm chữ số phần thập phân (bài tập)"   # tr.74
      - "Đổi chỗ hai thừa số thì tích không đổi; nhóm thừa số khác đi thì tích không đổi, dùng để tính thuận tiện bằng cách ghép cặp có tích tròn (bài tập, sách không gọi tên tính chất)"   # tr.75
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "71-75", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B22
    seq: 22
    book: T1
    topic: "CÁC PHÉP TÍNH VỚI SỐ THẬP PHÂN"
    lesson_no: 22
    title: "Phép chia số thập phân"
    skill_ids: [MATH.DECIMAL.DIVIDE]
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Khám phá chia số thập phân cho số tự nhiên: đổi số đo ra đơn vị nhỏ hơn, chia hai số tự nhiên rồi đổi thương về đơn vị ban đầu"   # tr.76
      - "Chia số thập phân cho số tự nhiên bằng phép chia dọc: chia phần nguyên trước; trước khi hạ chữ số đầu tiên của phần thập phân thì viết dấu phẩy vào bên phải thương; chia tiếp từng chữ số phần thập phân"   # tr.76
      - "Phần nguyên nhỏ hơn số chia hoặc có lượt chia không đủ: vẫn chia theo từng bước, lượt nào không đủ thì viết 0 ở thương"   # tr.77
      - "Suy ra thương của số thập phân từ một phép chia số tự nhiên đã biết (bài tập)"   # tr.77
      - "Chia số tự nhiên cho số tự nhiên còn dư (thương là số thập phân): viết dấu phẩy vào bên phải thương, viết thêm chữ số 0 vào bên phải số dư rồi chia tiếp; còn dư thì lặp lại"   # tr.78
      - "Số bị chia bé hơn số chia: viết số bị chia thành số thập phân (thêm ,0) rồi chia như chia số thập phân cho số tự nhiên, thương bắt đầu bằng 0"   # tr.79
      - "Nhân cả số bị chia và số chia với cùng một số khác 0 thì thương không đổi"   # tr.80
      - "Chia số tự nhiên cho số thập phân: đếm số chữ số phần thập phân của số chia, viết thêm bấy nhiêu chữ số 0 vào bên phải số bị chia; bỏ dấu phẩy ở số chia rồi chia như chia số tự nhiên"   # tr.81
      - "Chia số thập phân cho số thập phân: đếm số chữ số phần thập phân của số chia, chuyển dấu phẩy ở số bị chia sang phải bấy nhiêu chữ số; bỏ dấu phẩy ở số chia rồi chia như chia cho số tự nhiên"   # tr.81
      - "Số bị chia có ít chữ số phần thập phân hơn số chia: viết thêm chữ số 0 vào bên phải số bị chia cho đủ rồi mới chuyển dấu phẩy"   # tr.82
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "76-82", imported_at: 2026-10-20 }
