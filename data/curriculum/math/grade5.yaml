  # --- Chủ đề 3: MỘT SỐ ĐƠN VỊ ĐO DIỆN TÍCH
  - lesson_id: MATH5.T1.B15
    seq: 15
    book: T1
    topic: "MỘT SỐ ĐƠN VỊ ĐO DIỆN TÍCH"
    lesson_no: 15
    title: "Ki-lô-mét vuông. Héc-ta"
    skill_ids: []
    introduces_terms:   # đã đọc SGK 2026-10-20
      - term: "Ki-lô-mét vuông"   # tr.53
        patterns: ["ki-lô-mét vuông", "ki lô mét vuông", "kilômét vuông", "kilomet vuông", "km²", "km2", "km^2"]
      - term: "Héc-ta"   # tr.54
        patterns: ["héc-ta", "héc ta", "hécta", "hec-ta", "hecta", "re:(?<=\\d)\\s*ha(?![\\p{L}\\p{M}\\p{N}])"]
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Một ki-lô-mét vuông là diện tích hình vuông cạnh 1 km; dùng km² đo những vùng rộng (thành phố, khu rừng, vùng biển)"   # tr.53
      - "Đổi giữa km² và m² theo 1 km² = 1 000 000 m²: km² sang m² nhân 1 000 000, m² sang km² chia 1 000 000"   # tr.53
      - "Đọc, viết số đo diện tích có đơn vị km², kể cả số đo là số thập phân"   # tr.53
      - "Một héc-ta là diện tích hình vuông cạnh 100 m, viết tắt ha; dùng đo đất nông nghiệp, lâm nghiệp"   # tr.54
      - "Đổi giữa ha và m² theo 1 ha = 10 000 m²"   # tr.54
      - "Đổi giữa km² và ha theo 1 km² = 100 ha"   # tr.54
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "53-55", imported_at: 2026-10-20 }
  - lesson_id: MATH5.T1.B16
    seq: 16
    book: T1
    topic: "MỘT SỐ ĐƠN VỊ ĐO DIỆN TÍCH"
    lesson_no: 16
    title: "Các đơn vị đo diện tích"
    skill_ids: []
    introduces_terms: []   # đã đọc SGK 2026-10-20: không có thuật ngữ mới
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Xếp các đơn vị diện tích theo thứ tự km², ha, m², dm², cm², mm² (m² ở giữa; bên trái lớn hơn, bên phải bé hơn m²)"   # tr.56
      - "Hai đơn vị diện tích liền nhau trong bảng hơn kém nhau 100 lần: 1 đơn vị lớn = 100 đơn vị bé liền sau; 1 đơn vị bé = 1/100 đơn vị lớn liền trước"   # tr.56
      - "Quan hệ cách một bậc lấy từ bảng: 1 ha = 10 000 m², 1 m² = 1/10 000 ha"   # tr.56
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "56-59", imported_at: 2026-10-20 }
