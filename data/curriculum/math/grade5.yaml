      - "Chia số thập phân cho 0,1; 0,01; 0,001;...: chuyển dấu phẩy sang phải lần lượt một; hai; ba;... chữ số, thiếu chữ số thì viết thêm 0"   # tr.86
      - "Dùng chia cho 10; 100; 1 000 để đổi đơn vị đo từ nhỏ ra lớn, áp dụng cả cho số tự nhiên (bài tập)"   # tr.87
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "83-87", imported_at: 2026-10-20 }
