  - lesson_id: MATH5.T1.B4
    seq: 4
    book: T1
    topic: "ÔN TẬP VÀ BỔ SUNG"
    lesson_no: 4
    title: "Phân số thập phân"
    skill_ids: [MATH.FRACTION.DECIMAL_FRACTION]
    introduces_terms:   # đã đọc SGK 2026-10-20
      - term: "Phân số thập phân"   # tr.14
        patterns: ["phân số thập phân"]
    methods:   # đã đọc SGK 2026-10-20; diễn đạt lại, không chép nguyên văn
      - "Nhận biết phân số thập phân: phân số có mẫu số là 10, 100, 1 000, ..."   # tr.14
      - "Đặt phân số thập phân lên tia số: đoạn từ 0 đến 1 chia 10 phần bằng nhau ứng với các phần mười; phóng to một phần mười chia tiếp 10 phần ứng với các phần trăm"   # tr.15
      - "Viết phân số thành phân số thập phân bằng cách nhân cả tử và mẫu với cùng một số để mẫu thành 10, 100, 1 000"   # tr.15
      - "Hoặc chia cả tử và mẫu cho cùng một số để mẫu thành 100, 1 000"   # tr.15
      - "Chỉ một số phân số viết được thành phân số thập phân"   # tr.15
    source: { official_url: "https://taphuan.nxbgd.vn/tap-huan/doc-sach/sgk-toan-5-tap-mot.4699756373", pages: "14-15", imported_at: 2026-10-20 }
