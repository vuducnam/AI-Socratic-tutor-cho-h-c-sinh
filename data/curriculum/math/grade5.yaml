# Mục lục Toán 5 — Kết nối tri thức với cuộc sống (NXB Giáo dục Việt Nam)
# Quy tắc cứng 6 và 15 (CLAUDE.md), SPEC mục 5c.1.
# Chỉ nhập từ bản đọc chính thống taphuan.nxbgd.vn (quy tắc cứng 6).
# Không lấy từ hoatieu, loigiaihay, thuvienhoclieu hay bất kỳ trang bên thứ ba nào.
# Hướng dẫn điền từng trường: docs/CURRICULUM.md.
# Thứ tự lessons = thứ tự trong sách (lớp học đúng thứ tự SGK); seq liên tục từ 1.
#
# Nguồn (đọc ngày 2026-10-19):
# - Trên taphuan.nxbgd.vn, Toán 5 nằm ở mục "Bộ SGK thống nhất" (mục "SGK khác" không còn bộ
#   Kết nối tri thức). Trang tên sách in hình mờ "Kết nối tri thức với cuộc sống", Tổng chủ biên
#   Hà Huy Khoái, Chủ biên Lê Anh Vinh, "Tái bản lần thứ hai", bản quyền 2024.
# - lessons[] chép từ trang MỤC LỤC in trong sách (menu "Mục lục" của trình đọc báo "Chưa có mục lục").
#   Tên chủ đề giữ chữ in hoa như mục lục. Bài 1–35 ở Tập 1, Bài 36–75 ở Tập 2 (đánh số liên tục).
# - pages: trang bắt đầu lấy từ mục lục; trang kết thúc suy ra = trang bắt đầu bài kế tiếp - 1
#   (bài cuối mỗi tập: trước trang "Một số thuật ngữ dùng trong sách", T1 tr.139, T2 tr.135).
# - URL trang cụ thể: <official_url>#page=<chỉ số trang của trình đọc>. Chỉ số này KHÔNG trùng số
#   trang in (ví dụ T1 #page=7 hiện trang in 6), nên source.official_url dùng link cả cuốn.
# - imported_at: điền ngày chủ dự án duyệt xong (so từng dòng với mục lục).
# - Mỗi tập có trang cuối "Một số thuật ngữ dùng trong sách" (thuật ngữ + trang xuất hiện). Dùng làm
#   điểm bắt đầu khi đọc bài để điền introduces_terms (CURRICULUM §6.1), không thay cho việc đọc bài.

