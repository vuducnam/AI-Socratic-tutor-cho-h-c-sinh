      - "Nhân số thập phân với 10; 100; 1 000;...: chuyển dấu phẩy sang phải lần lượt một; hai; ba;... chữ số"   # tr.83
      - "Nhân số thập phân với 0,1; 0,01; 0,001;...: chuyển dấu phẩy sang trái lần lượt một; hai; ba;... chữ số"   # tr.84
      - "Dùng nhân với 10; 100; 1 000 để đổi đơn vị đo từ lớn ra nhỏ (bài tập)"   # tr.84
