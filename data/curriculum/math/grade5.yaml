#   (bài cuối mỗi tập: trước trang "Một số thuật ngữ dùng trong sách", T1 tr.139, T2 tr.135).
# - URL trang cụ thể: <official_url>#page=<chỉ số trang của trình đọc>. Chỉ số này KHÔNG trùng số
#   trang in (ví dụ T1 #page=7 hiện trang in 6), nên source.official_url dùng link cả cuốn.
# - imported_at: điền ngày chủ dự án duyệt xong (so từng dòng với mục lục).
# - Mỗi tập có trang cuối "Một số thuật ngữ dùng trong sách" (thuật ngữ + trang xuất hiện). Dùng làm
#   điểm bắt đầu khi đọc bài để điền introduces_terms (CURRICULUM §6.1), không thay cho việc đọc bài.

