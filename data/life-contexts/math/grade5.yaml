# Thư viện tình huống đời thật — Toán 5, số thập phân (SPEC §5b, quy tắc cứng 13).
# Tối thiểu 8 tình huống cho MỖI skill số thập phân (Bài 10–14, 19–24).
# Claude soạn nháp 2026-10-20; chủ dự án duyệt cả 72 mục qua chat cùng ngày. Mục mới duyệt ở /parent › Duyệt › Tình huống.
#
# Tiêu chuẩn: câu hỏi là câu người thật sẽ hỏi; số liệu hợp lý với đời sống Việt Nam, giá cả dùng "giả sử";
# market không quá 1/3 thư viện của một skill; adult_required = true cho bếp, dao, điện, ra ngoài, leo trèo;
# không tên nhãn hàng.
#
# Mọi số trong setup/real_question phải là biến {ten} khai trong variables (code điền số, LLM không đặt số).
# answer_expression tính đáp án từ biến để code chọn bộ số cho đáp án sạch.
# approved: do màn hình /parent › Duyệt ghi (không sửa tay); sửa mẫu sau khi duyệt → hash đổi → mất duyệt.
#
# Mẫu một mục:
#  - id: MATH5.DECIMAL.COMPARE.JUMP
#    skill_id: <skill thật>
#    theme: sport
#    min_grade: 5
#    max_grade: 5
#    template:
#      setup: "Trong giờ thể dục, Lan nhảy xa {a} và Hùng nhảy xa {b}."
#      real_question: "Bạn nào nhảy xa hơn?"
#      variables:
#        a: { min: 2.5, max: 3.6, step: 0.05, unit: "m" }
#        b: { min: 2.5, max: 3.6, step: 0.05, unit: "m" }
#      answer_expression: "a - b"
#      max_answer_decimals: 2
#      conditions: ["a != b"]
#      svg_kind: segment_bar
#    safety: { adult_required: false, notes: "" }
